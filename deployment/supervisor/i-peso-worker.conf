[program:i-peso-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/i-peso/i-peso-backend/artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/i-peso/i-peso-backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/i-peso/i-peso-backend/storage/logs/worker.log
stopwaitsecs=3600
