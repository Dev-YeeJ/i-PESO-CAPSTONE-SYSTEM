; i-PESO upload limits for PHP-FPM.
; Install to /etc/php/8.2/fpm/conf.d/99-i-peso-uploads.ini and restart php8.2-fpm.
;
; Keep these in line with client_max_body_size (12M) in deployment/nginx/i-peso-api.conf.
; Ubuntu's stock post_max_size is 8M: a bigger request reaching PHP is discarded entirely,
; so Laravel sees no file and reports "The ... field is required." instead of a size error.
; Laravel's own validation rules (e.g. 2MB profile photo, 5MB certificate) still apply.
upload_max_filesize = 12M
post_max_size = 12M
