name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'i-peso-frontend/**'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  contents: read

# A deploy that hangs must never wedge every deploy behind it: only one
# frontend deploy runs at a time, and a newer push supersedes an older one.
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # accept-new is exactly as strong as the ssh-keyscan step this replaces
      # (both trust whatever key the host first presents) but costs one fewer
      # connection to a host that throttles them.
      SSH_OPTS: >-
        -o StrictHostKeyChecking=accept-new
        -o BatchMode=yes
        -o ConnectTimeout=30
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: i-peso-frontend/package-lock.json

      - name: Install & build
        working-directory: i-peso-frontend
        timeout-minutes: 10
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_MAPS_EMBED_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_EMBED_API_KEY }}

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      # Proves the host is reachable and pins its key before the upload, so a
      # flaky connection retries here instead of part-way through an rsync
      # that runs with --delete against the live document root.
      - name: Wait for server
        timeout-minutes: 6
        run: |
          mkdir -p ~/.ssh
          for i in 1 2 3 4 5 6; do
            if ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} $SSH_OPTS \
                 ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} true; then
              echo "server reachable"
              exit 0
            fi
            echo "connection attempt $i failed, retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          echo "server unreachable after 6 attempts"
          exit 1

      - name: Upload build
        timeout-minutes: 10
        run: |
          rsync -avz --delete --exclude=/api --exclude=/backend-src \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} $SSH_OPTS" \
            i-peso-frontend/dist/ \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:~/domains/ipeso.website/public_html/
