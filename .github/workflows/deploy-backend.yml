name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'i-peso-backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Trust host key
        run: |
          for i in 1 2 3 4 5; do
            if ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null; then
              exit 0
            fi
            echo "ssh-keyscan attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "ssh-keyscan failed after 5 attempts"
          exit 1

      - name: Pull & build on server
        run: |
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} '
            cd ~/domains/ipeso.website/public_html/backend-src/i-peso-backend &&
            git pull origin main &&
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts &&
            php artisan package:discover --ansi &&
            php artisan migrate --force &&
            php artisan config:cache &&
            php artisan route:cache &&
            php artisan view:cache &&
            php artisan event:cache &&
            API_DOCROOT=~/domains/ipeso.website/public_html/api &&
            if [ -d "$API_DOCROOT" ] && [ ! -L "$API_DOCROOT" ]; then rm -rf "$API_DOCROOT"; fi &&
            ln -sfn ~/domains/ipeso.website/public_html/backend-src/i-peso-backend/public "$API_DOCROOT" &&
            ls -la "$API_DOCROOT" &&
            readlink -f "$API_DOCROOT"
          '
