; Shared hosting often ships conservative upload limits (commonly 2-8M),
; well under what a phone photo or a designed poster flyer needs. Laravel's
; own `max:` validation rule can't produce a friendly error if PHP itself
; already truncated/rejected the upload before Laravel ever sees it, so the
; PHP-level ceiling here is set comfortably above the Laravel-level limit.
upload_max_filesize = 12M
post_max_size = 60M
max_file_uploads = 10
